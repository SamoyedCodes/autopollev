name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Put Chromium inside the playwright package so PyInstaller bundles it.
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt pyinstaller
      - run: playwright install chromium
      - run: python -m unittest discover -s tests -p "test_*.py"

      # Stamp the tag into the version resource so it can never drift from the
      # release. Untagged runs keep the file's checked-in numbers.
      - name: Stamp version from tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -match '^v(\d+)\.(\d+)\.(\d+)$') {
            $tuple = "$($Matches[1]), $($Matches[2]), $($Matches[3]), 0"
            $text = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
            (Get-Content windows_version.txt) `
              -replace '\(\d+, \d+, \d+, \d+\)', "($tuple)" `
              -replace "'\d+\.\d+\.\d+\.\d+'", "'$text'" |
              Set-Content windows_version.txt
          }
          Get-Content windows_version.txt

      # --noupx and a version resource both cut Defender ML false positives on
      # unsigned PyInstaller builds; code signing is the only real cure.
      - run: >
          pyinstaller --noconfirm --name AutoPollEv --windowed --noupx
          --version-file windows_version.txt
          --collect-all playwright --collect-all win11toast
          main.py

      - name: Checksum
        run: Get-FileHash dist/AutoPollEv/AutoPollEv.exe -Algorithm SHA256 | Format-List

      - run: Compress-Archive -Path dist/AutoPollEv/* -DestinationPath AutoPollEv-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AutoPollEv-windows
          path: AutoPollEv-windows.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: AutoPollEv-windows.zip
